<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- White background circle for contrast -->
  <rect width="64" height="64" rx="10" fill="#ffffff"/>

  <!-- S — orange letterform (simplified bold S shape) -->
  <path d="M10 22 Q10 14 18 14 L32 14 Q36 14 36 19 Q36 24 32 24 L18 24 Q14 24 14 29 Q14 34 18 34 L32 34 Q40 34 40 42 Q40 50 32 50 L18 50 Q10 50 10 44"
        stroke="#F36F21" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <!-- M — grey letterform -->
  <path d="M26 50 L26 22 L36 38 L46 22 L46 50"
        stroke="#5a6a7e" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <!-- A — grey peak with red fill on the inner triangle -->
  <path d="M34 50 L46 20 L58 50" stroke="#5a6a7e" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <!-- red inner triangle of the A -->
  <path d="M38 42 L46 26 L54 42 Z" fill="#C0392B"/>
  <!-- crossbar of A -->
  <line x1="39" y1="40" x2="53" y2="40" stroke="#5a6a7e" stroke-width="4" stroke-linecap="round"/>
</svg>